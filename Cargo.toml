[package]
name = "tcamp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Configure and launch coding agent harnesses against tokencamp"
repository = "https://github.com/0xnicholas/tokencamp-tools"
publish = false

[lib]
name = "tcamp"
path = "src/lib.rs"

[[bin]]
name = "tcamp"
path = "src/main.rs"

[dependencies]
anstream = "1"
anstyle = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
fs4 = "1.1.0"
jiff = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml_edit = "0.22"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
assert_cmd = "2"
libc = "0.2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
